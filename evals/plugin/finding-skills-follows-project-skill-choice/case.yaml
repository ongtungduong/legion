schema_version: "1.1"
name: finding-skills-follows-project-skill-choice
context:
  scaffold_script: fixture.sh
execution:
  # The eval harness loads no CLAUDE.md, but a real session starts with it in
  # context. This is the same text the fixture writes to CLAUDE.md.
  append_system_prompt: |
    Project instructions (CLAUDE.md of the working directory):

    Skills in this repo are written with the project skill `house-skill-writer`,
    which knows our house format. Do not use any other skill-creator skill for them.
