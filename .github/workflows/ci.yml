name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate repo, spec, trigger evals, hook
        run: npm test

      - name: Shellcheck hooks
        run: shellcheck hooks/session-start tests/hooks/*.sh
