name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; the release job opts into the one extra scope it needs.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      # Refuse to release a tag that disagrees with the manifests, or a version
      # that has no changelog entry.
      - name: Check tag against package.json and CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          awk -v v="$version" '
            $0 ~ "^## " v " " { on = 1; next }
            /^## / { on = 0 }
            on
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no '## $version - <date>' section" >&2
            exit 1
          fi

      - name: Validate
        run: npm test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
